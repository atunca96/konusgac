<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Konuşgaç</title>
    <!-- The tray icon's right-click menu, drawn like the app's own menus instead of the plain Windows one. -->
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; }
      body { padding: 8px; font: 14px 'Segoe UI', system-ui, sans-serif; user-select: none; }
      .menu { background: #111317; border: 1px solid #353a45; border-radius: 8px; padding: 6px 8px; box-shadow: 0 6px 18px rgba(0, 0, 0, .5); color: #e9eaec; }
      .head { display: flex; align-items: center; gap: 8px; padding: 6px 8px 8px; font-weight: 700; color: #9aa0ab; font-size: 12px; text-transform: uppercase; letter-spacing: .02em; }
      .item { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 8px; border-radius: 4px; cursor: pointer; }
      .item:hover, .item.active { background: #e8590c; color: #fff; }
      .item.danger { color: #ff8787; }
      .item.danger:hover { background: #e03131; color: #fff; }
      .item.disabled { opacity: .45; pointer-events: none; }
      .label { flex: 1; }
      .check { width: 18px; height: 18px; border-radius: 4px; border: 2px solid #9aa0ab; display: grid; place-items: center; font-size: 12px; font-weight: 800; box-sizing: border-box; }
      .check.on { background: #e8590c; border-color: #e8590c; color: #fff; }
      .item:hover .check { border-color: #fff; }
      .sep { height: 1px; margin: 4px; background: #353a45; }
    </style>
  </head>
  <body>
    <div class="menu" id="menu">
      <div class="head">Konuşgaç</div>
      <div class="item" data-action="open"><span class="label">Konuşgaç'ı aç</span></div>
      <div class="sep"></div>
      <div class="item" data-action="mute" id="mute"><span class="label">Mikrofonu kapat</span><span class="check"></span></div>
      <div class="item" data-action="deafen" id="deafen"><span class="label">Sesi kapat</span><span class="check"></span></div>
      <div class="sep"></div>
      <div class="item" data-action="update" id="update"><span class="label">Güncellemeleri denetle</span></div>
      <div class="sep"></div>
      <div class="item danger" data-action="quit"><span class="label">Konuşgaç'tan çık</span></div>
    </div>
    <script>
      const setCheck = (id, on) => {
        const box = document.querySelector(`#${id} .check`);
        box.classList.toggle('on', on);
        box.textContent = on ? '✓' : '';
      };
      window.trayMenu.onState((s) => {
        setCheck('mute', s.muted);
        setCheck('deafen', s.deafened);
        document.getElementById('update').classList.toggle('disabled', !s.canUpdate);
        // The main process sizes the window to the menu before showing it.
        window.trayMenu.size(Math.ceil(document.body.getBoundingClientRect().width), Math.ceil(document.body.scrollHeight));
      });
      document.getElementById('menu').addEventListener('click', (e) => {
        const item = e.target.closest('.item');
        if (item) window.trayMenu.action(item.dataset.action);
      });
      document.addEventListener('keydown', (e) => e.key === 'Escape' && window.trayMenu.action('close'));
    </script>
  </body>
</html>
